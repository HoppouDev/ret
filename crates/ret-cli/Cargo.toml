[package]
name = "ret-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Reverse tethering for Android over adb"
license = "MIT"

[package.metadata.deb]
name = "ret"
maintainer = "HoppouDev <me@hoppou.dev>"
copyright = "2026 HoppouDev"
depends = "libc6, libgcc-s1, libxkbcommon0, libxkbcommon-x11-0, libwayland-client0, libegl1"
suggests = "mesa-vulkan-drivers"
section = "net"
revision = "1"
triggers-file = "../../packaging/linux/debian/triggers"
assets = [
    ["../../target/release/ret", "usr/bin/", "755"],
    ["../../target/release/ret-ui", "usr/bin/", "755"],
    ["../../target/release/ret.apk", "usr/share/ret/", "644"],
    ["../../packaging/linux/ret.desktop", "usr/share/applications/", "644"],
    ["../../assets/ret.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
]

[package.metadata.generate-rpm]
name = "ret"
release = "1"
auto-req = "no"
requires = { "libc.so.6()(64bit)" = "*", "libgcc_s.so.1()(64bit)" = "*", "libm.so.6()(64bit)" = "*", "libxkbcommon.so.0()(64bit)" = "*", "libxkbcommon-x11.so.0()(64bit)" = "*", "libwayland-client.so.0()(64bit)" = "*", "libEGL.so.1()(64bit)" = "*" }
assets = [
    { source = "../../target/release/ret", dest = "/usr/bin/ret", mode = "755" },
    { source = "../../target/release/ret-ui", dest = "/usr/bin/ret-ui", mode = "755" },
    { source = "../../target/release/ret.apk", dest = "/usr/share/ret/ret.apk", mode = "644" },
    { source = "../../packaging/linux/ret.desktop", dest = "/usr/share/applications/ret.desktop", mode = "644" },
    { source = "../../assets/ret.png", dest = "/usr/share/icons/hicolor/256x256/apps/ret.png", mode = "644" },
    { source = "../../LICENSE", dest = "/usr/share/licenses/ret/LICENSE", mode = "644", doc = true },
]
[[bin]]
name = "ret"
path = "src/main.rs"

[dependencies]
clap.workspace = true
ctrlc.workspace = true
ret-adb.workspace = true
ret-relay.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
