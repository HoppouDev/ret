[workspace]
resolver = "3"
members = ["crates/*"]

# The version of every crate, set by `cog bump` to the version of the release tag
[workspace.package]
version = "0.1.0"
edition = "2024"
# the crates are not published, internal dependencies have no version requirement
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
byteorder = "1.5.0"
catppuccin = { version = "2.8.0", features = ["iced"] }
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.0.3", features = ["termination"] }
iced = { version = "0.14.0", features = ["tokio"] }
iced_fonts = { version = "0.3.0", features = ["lucide"] }
rand = "0.10.3"
ret-adb = { path = "crates/ret-adb" }
ret-relay = { path = "crates/ret-relay" }
tokio = { version = "1.53.2", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["chrono", "env-filter"] }

[profile.release]
lto = true
