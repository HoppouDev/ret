[workspace]
resolver = "3"
members = ["crates/*"]

# The version of every crate, set by `cog bump` to the version of the release tag
[workspace.package]
version = "0.2.0"
edition = "2024"
# the crates are not published, internal dependencies have no version requirement
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
adb_client = { version = "3.2.3", default-features = false }
byteorder = "1.5.0"
catppuccin = { version = "2.8.0", features = ["iced"] }
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = { version = "3.0.3", features = ["termination"] }
dirs = "7.0.0"
iced = { version = "0.14.0", features = ["advanced", "tokio"] }
iced_fonts = { version = "0.3.0", features = ["lucide"] }
rand = "0.10.3"
ret-adb = { path = "crates/ret-adb" }
ret-relay = { path = "crates/ret-relay" }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["chrono", "env-filter"] }

# Smaller binaries, see https://github.com/johnthagen/min-sized-rust. Only the measures which keep
# the behavior: panics still unwind, so that the window survives a crash of the relay or adb.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# the relay handles every packet of the devices: size costs it 19% on the TCP checksum
[profile.release.package.ret-relay]
opt-level = 3
