name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: validate and export source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      epoch: ${{ steps.version.outputs.epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - name: Validate release versions
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          mkdir dist
          args=()
          if [[ -n "$RELEASE_TAG" ]]; then args+=("$RELEASE_TAG"); fi
          version=$(python3 packaging/check-release.py "${args[@]}")
          python3 packaging/check-release.py "${args[@]}" --source-archive "dist/ret-$version.tar.gz"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source
          path: dist/ret-*.tar.gz
          if-no-files-found: error

  apk:
    name: build and verify Android
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
      - name: Build signed APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in RELEASE_KEYSTORE_BASE64 ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD \
            ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "::error::$key is required to sign the release APK"
              exit 1
            fi
          done
          umask 077
          keystore=$(mktemp "$RUNNER_TEMP/ret-signing-XXXXXX.jks")
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          ./gradlew --no-daemon :app:check :app:assembleRelease -PRELEASE_STORE_FILE="$keystore"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/release/ret-release.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk
          path: app/build/outputs/apk/release/ret-release.apk
          if-no-files-found: error

  windows:
    name: Windows (${{ matrix.arch }})
    needs: [source, apk]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - run: rustup toolchain install 1.98.0 --profile minimal && rustup default 1.98.0
      - name: Build and test native Windows programs
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          rustup target add "$RUST_TARGET"
          cargo build --workspace --release --locked --target "$RUST_TARGET"
          cargo test --workspace --locked --target "$RUST_TARGET"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apk
          path: apk
      - name: Build installer
        env:
          VERSION: ${{ needs.source.outputs.version }}
          ARCH: ${{ matrix.arch }}
          RUST_TARGET: ${{ matrix.target }}
        run: |
          iscc=''
          for candidate in "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/c/Program Files/Inno Setup 6/ISCC.exe"; do
            if [[ -f $candidate ]]; then iscc=$candidate; break; fi
          done
          [[ -n $iscc ]] || { echo 'Missing preinstalled Inno Setup compiler' >&2; exit 1; }
          mkdir -p "dist/ret-windows-$ARCH"
          cp "target/$RUST_TARGET/release/ret.exe" "target/$RUST_TARGET/release/ret-ui.exe" "dist/ret-windows-$ARCH/"
          cp packaging/windows/ret-run.cmd LICENSE "dist/ret-windows-$ARCH/"
          cp apk/ret-release.apk "dist/ret-windows-$ARCH/ret.apk"
          MSYS2_ARG_CONV_EXCL='*' "$iscc" \
            /DAppVersion="$VERSION" /DAppArch="$ARCH" \
            "/DFilesDir=$(cygpath -w "$PWD/dist/ret-windows-$ARCH")" \
            "/DOutputDir=$(cygpath -w "$PWD/dist")" packaging/windows/ret.iss
      - name: Exercise native Windows installer
        shell: pwsh
        env:
          VERSION: ${{ needs.source.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = Join-Path $env:RUNNER_TEMP 'ret-install'
          $installer = "dist/ret-setup-$env:VERSION-windows-$env:ARCH.exe"
          $result = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$destination") -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Installer failed with $($result.ExitCode)" }
          try {
            $binary = Join-Path $destination 'ret.exe'
            if ((& $binary --version) -ne "ret $env:VERSION" -or $LASTEXITCODE -ne 0) { throw 'Installed CLI version mismatch' }
            $bytes = [IO.File]::ReadAllBytes($binary)
            $machine = [BitConverter]::ToUInt16($bytes, [BitConverter]::ToInt32($bytes, 0x3c) + 4)
            $expected = if ($env:ARCH -eq 'arm64') { 0xaa64 } else { 0x8664 }
            if ($machine -ne $expected) { throw 'Installed CLI architecture mismatch' }
            if ((Get-FileHash "$destination/ret.apk").Hash -ne (Get-FileHash 'apk/ret-release.apk').Hash) { throw 'Installed APK mismatch' }
          } finally {
            $result = Start-Process -FilePath "$destination/unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
            if ($result.ExitCode -ne 0) { throw "Uninstaller failed with $($result.ExitCode)" }
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-windows-${{ matrix.arch }}
          path: dist/ret-setup-*.exe
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.kind }}, ${{ matrix.arch }})
    needs: [source, apk]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: glibc
            arch: x86_64
            runner: ubuntu-24.04
            image: rust:1.98.0-bullseye@sha256:4730e387a220a08a365c77da3096544dde214f9d796c16284d4be45438cad4a9
          - kind: glibc
            arch: aarch64
            runner: ubuntu-24.04-arm
            image: rust:1.98.0-bullseye@sha256:4730e387a220a08a365c77da3096544dde214f9d796c16284d4be45438cad4a9
          - kind: arch
            arch: x86_64
            runner: ubuntu-24.04
            image: archlinux:base-devel
          - kind: alpine
            arch: x86_64
            runner: ubuntu-24.04
            image: alpine:3.24
          - kind: alpine
            arch: aarch64
            runner: ubuntu-24.04-arm
            image: alpine:3.24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source
          path: inputs
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apk
          path: inputs
      - name: Build native packages
        env:
          VERSION: ${{ needs.source.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ needs.source.outputs.epoch }}
          IMAGE: ${{ matrix.image }}
          KIND: ${{ matrix.kind }}
        run: |
          mkdir dist
          docker run --rm -e SOURCE_DATE_EPOCH -e VERSION -e KIND \
            -v "$PWD/inputs:/inputs:ro" -v "$PWD/dist:/out" \
            -v "$PWD/packaging/build-linux:/build-linux:ro" "$IMAGE" \
            sh -ec 'if [ "$KIND" = alpine ]; then apk add --no-cache bash; fi; exec bash /build-linux "$KIND" "$VERSION"'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.kind }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.arch }})
    needs: [source, apk]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false
      - run: rustup toolchain install 1.98.0 --profile minimal && rustup default 1.98.0
      - run: cargo build --workspace --release --locked && cargo test --workspace --locked
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apk
          path: apk
      - name: Package and exercise macOS distributions
        env:
          VERSION: ${{ needs.source.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: bash packaging/build-macos "$VERSION" "$ARCH" apk/ret-release.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: verify assets and publish
    needs: [source, apk, windows, linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        if: github.event_name == 'push'
        with:
          install-only: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source
          path: dist
      - name: Verify complete release manifest
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: |
          cp LICENSE dist/LICENSE
          python3 packaging/check-assets.py "$VERSION" dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
      - name: Generate release notes
        if: github.event_name == 'push'
        run: cog changelog --at "$GITHUB_REF_NAME" > notes.md
      - name: Publish complete release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --title "$GITHUB_REF_NAME" --notes-file notes.md dist/*
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
