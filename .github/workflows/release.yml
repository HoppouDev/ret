name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# never cancel a release halfway through publishing it
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            exe: ""
          - name: windows
            os: windows-latest
            exe: .exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # no build cache: a release must not restore artifacts written by other workflows
      - run: rustup toolchain install stable --profile minimal && rustup default stable

      - run: cargo build --release --locked

      # the command-line interface and the window, both at the root of the artifact
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.name }}
          path: |
            target/release/ret${{ matrix.exe }}
            target/release/ret-ui${{ matrix.exe }}
          if-no-files-found: error

  apk:
    name: build (android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      # validates the wrapper jar, caching stays off for the same reason as the relay build
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Build signed APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set, refusing to publish an unsigned APK"
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.jks"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$keystore"
          ./gradlew --no-daemon :app:assembleRelease -PRELEASE_STORE_FILE="$keystore"
          rm "$keystore"
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --print-certs app/build/outputs/apk/release/ret-release.apk

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk
          path: app/build/outputs/apk/release/ret-release.apk
          if-no-files-found: error

  release:
    name: publish
    needs: [build, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # cog reads the whole history and the tags to generate the changelog
          fetch-depth: 0
          persist-credentials: false

      - uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          install-only: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: bin

      - name: Package
        run: |
          linux="ret-linux64"
          windows="ret-win64"
          mkdir -p "dist/$linux" "dist/$windows"

          # artifacts do not keep the executable bit
          for binary in ret ret-ui; do
            cp "bin/binary-linux/$binary" "dist/$linux/"
            chmod 755 "dist/$linux/$binary"
          done
          cp bin/apk/ret-release.apk "dist/$linux/ret.apk"
          cp bin/binary-windows/ret.exe bin/binary-windows/ret-ui.exe \
            crates/ret-cli/scripts/ret-run.cmd "dist/$windows/"
          cp bin/apk/ret-release.apk "dist/$windows/ret.apk"

          cd dist
          zip -r "$linux-$GITHUB_REF_NAME.zip" "$linux"
          zip -r "$windows-$GITHUB_REF_NAME.zip" "$windows"
          sha256sum -- *.zip > SHA256SUMS.txt

      # legacy commits that do not follow Conventional Commits are reported on stderr and skipped
      - run: cog changelog --at "$GITHUB_REF_NAME" > notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md \
            dist/*.zip dist/SHA256SUMS.txt
