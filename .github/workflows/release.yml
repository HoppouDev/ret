name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# never cancel a release halfway through publishing it
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: apk
    strategy:
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            exe: ""
          - name: windows
            os: windows-latest
            exe: .exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the installer embeds the icon of the repository, stored with git lfs
          lfs: true
          persist-credentials: false

      # no build cache: a release must not restore artifacts written by other workflows
      - run: rustup toolchain install stable --profile minimal && rustup default stable

      - run: cargo build --release --locked

      # the command-line interface and the window, both at the root of the artifact
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.name }}
          path: |
            target/release/ret${{ matrix.exe }}
            target/release/ret-ui${{ matrix.exe }}
          if-no-files-found: error

      # the installer embeds the Android application, built by the apk job
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: matrix.name == 'windows'
        with:
          name: apk
          path: apk

      - name: Build the Windows installer
        if: matrix.name == 'windows'
        run: |
          choco install innosetup --no-progress
          mkdir -p dist/ret-win64
          cp target/release/ret.exe target/release/ret-ui.exe dist/ret-win64/
          cp packaging/windows/ret-run.cmd dist/ret-win64/
          cp apk/ret-release.apk dist/ret-win64/ret.apk
          MSYS2_ARG_CONV_EXCL='*' "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            /DAppVersion="${GITHUB_REF_NAME#v}" \
            "/DFilesDir=$(cygpath -w "$PWD/dist/ret-win64")" \
            "/DOutputDir=$(cygpath -w "$PWD/dist")" \
            packaging/windows/ret.iss

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.name == 'windows'
        with:
          name: installer-windows
          path: dist/ret-setup-*.exe
          if-no-files-found: error

  apk:
    name: build (android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      # validates the wrapper jar, caching stays off for the same reason as the relay build
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Build signed APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set, refusing to publish an unsigned APK"
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.jks"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$keystore"
          ./gradlew --no-daemon :app:assembleRelease -PRELEASE_STORE_FILE="$keystore"
          rm "$keystore"
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --print-certs app/build/outputs/apk/release/ret-release.apk

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk
          path: app/build/outputs/apk/release/ret-release.apk
          if-no-files-found: error

  release:
    name: publish
    needs: [build, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # cog reads the whole history and the tags to generate the changelog
          fetch-depth: 0
          # the packages embed the icon of the repository, stored with git lfs
          persist-credentials: false

      - uses: cocogitto/cocogitto-action@52d0023b4396897f1815648e553db2ab8d782f3a # v4.2.0
        with:
          install-only: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: bin

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p target/release app/build/outputs/apk/release

          # artifacts do not keep the executable bit
          cp bin/binary-linux/ret bin/binary-linux/ret-ui target/release/
          chmod 755 target/release/ret target/release/ret-ui
          cp bin/apk/ret-release.apk target/release/ret.apk

          # the generic tarball of the linux build
          mkdir -p dist/ret-x86_64
          cp target/release/ret target/release/ret-ui target/release/ret.apk dist/ret-x86_64/
          tar -czf "dist/ret-x86_64-$version.tar.gz" -C dist ret-x86_64

          # the Android application, published on its own
          cp bin/apk/ret-release.apk "dist/ret-v$version.apk"

          # the deb and the rpm of Fedora and openSUSE, from the linux build
          cargo install --locked cargo-deb cargo-generate-rpm
          cargo deb -p ret-cli --no-build
          (cd crates/ret-cli && cargo generate-rpm)
          cp target/debian/ret_*.deb dist/
          cp crates/ret-cli/target/generate-rpm/ret-*.rpm dist/

          # the rpm of RHEL, built in a container with an old glibc
          docker run --rm \
            -e VERSION="$version" -v "$PWD":/work -w /work rust:1-bullseye bash -ec '
            cargo install --quiet cargo-generate-rpm
            cargo build --release --locked --target-dir target-rhel
            cp dist/ret-v'"$version"'.apk target-rhel/release/ret.apk
            cd crates/ret-cli
            cargo generate-rpm --set-metadata "assets = [
              { source = \"../../target-rhel/release/ret\", dest = \"/usr/bin/ret\", mode = \"755\" },
              { source = \"../../target-rhel/release/ret-ui\", dest = \"/usr/bin/ret-ui\", mode = \"755\" },
              { source = \"../../target-rhel/release/ret.apk\", dest = \"/usr/share/ret/ret.apk\", mode = \"644\" },
            ]" -o "../../dist/ret-$VERSION-1.el9.x86_64.rpm"
          '

          # the AppImage, built in a container with an old glibc
          docker run --rm \
            -e VERSION="$version" -v "$PWD":/work -w /work rust:1-bullseye bash -ec '
            curl -sL -o appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
            chmod +x appimagetool.AppImage
            cargo build --release --locked --target-dir target-appimage
            rm -rf AppDir
            mkdir -p AppDir/usr/bin AppDir/usr/share/ret AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
            cp target-appimage/release/ret target-appimage/release/ret-ui AppDir/usr/bin/
            cp packaging/linux/ret.desktop AppDir/usr/share/applications/
            cp packaging/linux/ret.desktop AppDir/
            cp assets/ret.png AppDir/ret.png
            cp packaging/linux/appimage/AppRun AppDir/AppRun
            cp dist/ret-v'"$version"'.apk AppDir/usr/share/ret/ret.apk
            ./appimagetool.AppImage --appimage-extract-and-run AppDir "dist/ret-$VERSION-x86_64.AppImage"
          '

          # the Alpine package, built in a container against the musl of the image
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" packaging/linux/alpine/APKBUILD
          docker run --rm -e VERSION="$version" -v "$PWD":/work -w /work alpine:latest sh -ec '
            apk add alpine-sdk rust cargo unzip sudo >/dev/null
            adduser -D builder
            addgroup builder abuild
            echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
            mkdir -p /home/builder/test /home/builder/packages /var/cache/distfiles
            cp packaging/linux/alpine/APKBUILD /home/builder/test/
            cp dist/ret-v'"$version"'.apk /var/cache/distfiles/ret.apk
            chown -R builder:builder /home/builder /var/cache/distfiles
            su builder -c "cd /home/builder/test && abuild-keygen -a -n && abuild checksum"
            cp /home/builder/.abuild/*.rsa.pub /etc/apk/keys/
            su builder -c "cd /home/builder/test && abuild -r"
            cp /home/builder/packages/builder/x86_64/ret-*.apk /work/dist/
          '

          # the Arch Linux package, built in a container against the pacman of the image
          docker run --rm \
            -e VERSION="$version" -v "$PWD":/work -w /work archlinux:base-devel bash -ec '
            sed -i "s/^pkgver=.*/pkgver=$VERSION/" packaging/linux/arch/PKGBUILD
            pacman -Sy archlinux-keyring --noconfirm
            pacman -Syu --needed --noconfirm rust pacman-contrib hicolor-icon-theme libxkbcommon libxkbcommon-x11 wayland libglvnd
            useradd -m builder
            mkdir -p /home/builder/packaging/linux/arch /home/builder/assets /home/builder/srcdest
            cp packaging/linux/arch/PKGBUILD /home/builder/packaging/linux/arch/
            cp packaging/linux/ret.desktop /home/builder/packaging/linux/
            cp assets/ret.png /home/builder/assets/
            cp dist/ret-v'"$version"'.apk /home/builder/srcdest/ret-v'"$version"'.apk
            chown -R builder:builder /home/builder
            su builder -c "export SRCDEST=/home/builder/srcdest && cd /home/builder/packaging/linux/arch && updpkgsums && makepkg -f"
            cp /home/builder/packaging/linux/arch/ret-*.pkg.tar.zst /work/dist/
          '

          # the Windows installer, built by the windows job
          cp bin/installer-windows/ret-setup-*.exe dist/

      # legacy commits that do not follow Conventional Commits are reported on stderr and skipped
      - run: cog changelog --at "$GITHUB_REF_NAME" > notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file notes.md \
            dist/ret-x86_64-*.tar.gz dist/ret-v*.apk dist/*.deb dist/*.rpm \
            dist/ret-0.*.apk dist/*.AppImage dist/ret-setup-*.exe dist/*.pkg.tar.zst
