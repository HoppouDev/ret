apply plugin: 'checkstyle'

checkstyle {
    toolVersion = '14.3.0'
}

def checkstyleTask = tasks.register('checkstyle', Checkstyle) {
    description = 'Check Java style with Checkstyle'
    group = 'verification'
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
    source = android.sourceSets.collectMany { it.java.srcDirs }.findAll { it.exists() }
    classpath = files()
    ignoreFailures = true
}

tasks.named('check') {
    dependsOn checkstyleTask
}
