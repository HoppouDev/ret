plugins {
    id 'com.android.application'
}

base {
    archivesName = 'ret' // change apk name
}

android {
    namespace = 'dev.hoppou.ret'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId = 'dev.hoppou.ret'
        minSdk = 21
        targetSdk = 29
        versionCode = 9
        versionName = '2.5.1'
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        // ret is not distributed through Google Play, and raising targetSdk
        // changes foreground service and runtime behavior.
        disable += 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'junit:junit:4.13.2'
}

apply from: "$rootDir/config/android-checkstyle.gradle"
apply from: "$rootDir/config/android-signing.gradle"
